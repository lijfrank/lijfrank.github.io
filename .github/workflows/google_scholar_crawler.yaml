name: Get Citation Data

on: 
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch: # 强烈建议添加：允许在 GitHub 网页端手动点击运行，方便调试

jobs:
  build:
    runs-on: ubuntu-latest
    # 赋予工作流写入仓库的权限（解决 GITHUB_TOKEN 无法 push 的问题）
    permissions:
      contents: write 
      
    steps:
      - uses: actions/checkout@v7
      
      - name: Install Reqs
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-setuptools python3-venv

      - name: Set up Python environment
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r google_scholar_crawler/requirements.txt

      # 【修复2】增加超时保护、禁用 Git 交互提示、规范推送逻辑
      - name: Run Crawler and Push Results
        timeout-minutes: 15  # 防止爬虫网络问题导致无限期卡死
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
          GIT_TERMINAL_PROMPT: 0 # 【核心修复】禁用 Git 密码提示，认证失败会立即报错退出，防止卡死！
        run: |
          source venv/bin/activate
          python3 google_scholar_crawler/main.py
          
          cd ./results
          git init
          git config --local user.name "${GITHUB_ACTOR}"
          git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          
          # 【修复3】使用 GitHub 官方推荐的 x-access-token 格式，更稳定
          export remote_repo="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          
          git add *.json
          
          # 【修复4】检查是否有文件更改，避免没有更新时 git commit 报错导致流水线失败
          if git diff --cached --quiet; then
            echo "✅ No changes to commit, skipping push."
          else
            git commit -m "Updated Citation Data"
            git push "${remote_repo}" HEAD:google-scholar-stats --force
            echo "✅ Successfully pushed to google-scholar-stats branch."
          fi