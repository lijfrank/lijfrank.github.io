name: Get Citation Data

on: 
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      
    steps:
      - uses: actions/checkout@v7
      
      - name: Install Reqs
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-setuptools python3-venv

      - name: Set up Python environment
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r google_scholar_crawler/requirements.txt

      - name: Run Crawler and Push Results
        timeout-minutes: 15
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
          GIT_TERMINAL_PROMPT: 0
        run: |
          source venv/bin/activate
          python3 google_scholar_crawler/main.py
          
          cd ./results
          git init
          git config --local user.name "${GITHUB_ACTOR}"
          git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          
          # 【修复3】使用 GitHub 官方推荐的 x-access-token 格式，更稳定
          export remote_repo="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          
          git add *.json
          
          if git diff --cached --quiet; then
            echo "✅ No changes to commit, skipping push."
          else
            git commit -m "Updated Citation Data"
            git push "${remote_repo}" HEAD:google-scholar-stats --force
            echo "✅ Successfully pushed to google-scholar-stats branch."
          fi