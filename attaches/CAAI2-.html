<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --sidebar-bg:#0a1324;--sidebar-hover:#111f3a;--sidebar-active:#172c52;
  --content-bg:#f6f4ef;--surface:#fff;--accent:#b8860b;--accent-hover:#9a7209;
  --text-primary:#1c1c1c;--text-secondary:#555;--text-muted:#999;--border:#e2dfd8;
  --a-bg:#fdf3e0;--a-color:#b8860b;--b-bg:#e3eef7;--b-color:#2a6496;--c-bg:#f0f0f0;--c-color:#6e6e6e;
}
html{scroll-behavior:smooth}
body{font-family:'Noto Serif SC',Georgia,serif;background:var(--content-bg);color:var(--text-primary);display:flex;min-height:100vh}
.sidebar{width:272px;background:var(--sidebar-bg);position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;display:flex;flex-direction:column}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}
.sidebar-header{padding:28px 24px 20px;border-bottom:1px solid rgba(255,255,255,.06)}
.sidebar-header h1{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:700;color:#fff;letter-spacing:.02em;line-height:1.35}
.sidebar-header .sub{font-size:11px;color:#5a6a80;margin-top:5px;font-family:'DM Mono',monospace;letter-spacing:.04em}
.nav-wrap{padding:12px 10px;flex:1}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#4a5a70;padding:10px 14px 6px;font-family:'DM Mono',monospace}
.nav-btn{display:flex;align-items:center;width:100%;padding:9px 14px;border:none;background:0 0;color:#8a96a8;font-size:13px;font-family:'Noto Serif SC',serif;cursor:pointer;border-radius:8px;transition:all .18s;text-align:left;gap:10px;margin:1px 0}
.nav-btn:hover{background:var(--sidebar-hover);color:#c0c8d4}
.nav-btn.active{background:var(--sidebar-active);color:var(--accent)}
.nav-icon{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;background:rgba(255,255,255,.05);transition:all .18s}
.nav-btn.active .nav-icon{background:rgba(184,134,11,.18);color:var(--accent)}
.nav-count{margin-left:auto;font-size:10px;font-family:'DM Mono',monospace;color:#4a5a70;background:rgba(255,255,255,.04);padding:2px 6px;border-radius:4px}
.main{margin-left:272px;flex:1;padding:36px 44px 60px;min-width:0}
.page-header{margin-bottom:28px}
.page-header h2{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;color:var(--text-primary);line-height:1.25}
.page-header p{color:var(--text-secondary);font-size:13px;margin-top:4px}
.filter-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.fg{display:flex;gap:3px;background:var(--surface);border-radius:10px;padding:3px;border:1px solid var(--border)}
.fb{padding:5px 13px;border:none;background:0 0;color:var(--text-secondary);font-size:12px;font-family:'Noto Serif SC',serif;cursor:pointer;border-radius:7px;transition:all .18s;white-space:nowrap}
.fb:hover{color:var(--text-primary);background:rgba(0,0,0,.03)}
.fb.on{background:var(--sidebar-bg);color:#fff}
.search-box{flex:1;min-width:180px;position:relative}
.search-box input{width:100%;padding:7px 14px 7px 34px;border:1px solid var(--border);border-radius:10px;font-size:13px;font-family:'Noto Serif SC',serif;background:var(--surface);color:var(--text-primary);outline:0;transition:border-color .2s}
.search-box input:focus{border-color:var(--accent)}
.search-box .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:15px;pointer-events:none}
.stats{font-size:11px;color:var(--text-muted);font-family:'DM Mono',monospace;margin-bottom:12px;letter-spacing:.03em}
.tbl-wrap{background:var(--surface);border-radius:14px;border:1px solid var(--border);overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.035)}
table{width:100%;border-collapse:collapse}
thead th{background:#f2f0ea;padding:11px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.07em;border-bottom:2px solid var(--border);font-family:'DM Mono',monospace;position:sticky;top:0;z-index:5;white-space:nowrap}
tbody tr{transition:background .12s}
tbody tr:hover{background:#faf8f3}
tbody td{padding:9px 14px;font-size:12.5px;border-bottom:1px solid #f0ede6;vertical-align:top;line-height:1.5}
td.c-dir{white-space:nowrap;font-weight:600;color:var(--text-secondary);font-size:12px}
.tag{display:inline-block;padding:1px 9px;border-radius:10px;font-size:10.5px;font-weight:700;font-family:'DM Mono',monospace;letter-spacing:.03em}
.tag-a{background:var(--a-bg);color:var(--a-color)}
.tag-b{background:var(--b-bg);color:var(--b-color)}
.tag-c{background:var(--c-bg);color:var(--c-color)}
.tag-t{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10.5px;background:#f0ede6;color:var(--text-secondary)}
td.c-no{font-family:'DM Mono',monospace;font-size:11.5px;color:var(--text-muted);text-align:center}
td.c-abbr{font-family:'DM Mono',monospace;font-weight:500;color:var(--accent);font-size:11.5px;white-space:nowrap}
td.c-full{font-size:12px;line-height:1.45;min-width:220px}
td.c-pub{font-size:11.5px;color:var(--text-secondary);white-space:nowrap}
td.c-url a{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--accent);text-decoration:none;word-break:break-all;transition:color .15s}
td.c-url a:hover{color:var(--accent-hover);text-decoration:underline}
.empty-msg{text-align:center;padding:52px 20px;color:var(--text-muted);font-style:italic;font-size:14px}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
tbody tr{animation:fadeUp .25s ease forwards;opacity:0}
tbody tr:nth-child(1){animation-delay:.02s}
tbody tr:nth-child(2){animation-delay:.04s}
tbody tr:nth-child(3){animation-delay:.06s}
tbody tr:nth-child(4){animation-delay:.08s}
tbody tr:nth-child(5){animation-delay:.1s}
tbody tr:nth-child(n+6){animation-delay:.12s}
@media(max-width:900px){
  .sidebar{width:56px;padding:0}
  .sidebar-header{padding:16px 0;text-align:center}
  .sidebar-header h1,.sidebar-header .sub,.nav-label,.nav-btn span:not(.nav-icon),.nav-count{display:none}
  .nav-btn{justify-content:center;padding:10px 0}
  .nav-wrap{padding:8px 6px}
  .main{margin-left:56px;padding:20px 14px 40px}
  .filter-bar{gap:6px}
}
@media(max-width:600px){
  .sidebar{display:none}
  .main{margin-left:0;padding:14px 8px 30px}
}
</style>

  "机器系统":"智能机器人与系统",
  "芯片系统":"智能芯片与计算系统",
  "伦理安全":"人工智能伦理、安全与治理"
};
let curDir="all",curLevel="all",curType="all",query="";
function render(){
  const rows=D.filter(r=>(curDir==="all"||r.d===curDir)&&(curLevel==="all"||r.l===curLevel)&&(curType==="all"||r.t===curType)&&(!query||r.ab.toLowerCase().includes(query)||r.f.toLowerCase().includes(query)||r.p.toLowerCase().includes(query)));
  const tb=document.getElementById("tb");
  if(!rows.length){tb.innerHTML='<tr><td colspan="8" class="empty-msg">没有匹配的结果</td></tr>';}
  else{tb.innerHTML=rows.map(r=>`<tr><td class="c-dir">${DIR_NAMES[r.d]||r.d}</td><td><span class="tag tag-${r.l.toLowerCase()}">${r.l}类</span></td><td><span class="tag-t">${r.t}</span></td><td class="c-no">${r.n}</td><td class="c-abbr">${r.ab||"—"}</td><td class="c-full">${r.f}</td><td class="c-pub">${r.p}</td><td class="c-url">${r.u?'<a href="'+r.u+'" target="_blank" rel="noopener">'+r.u+'</a>':"—"}</td></tr>`).join("");}
  document.getElementById("st").textContent=`共 ${rows.length} 条记录`;
  document.getElementById("title").textContent=curDir==="all"?"全部方向":DIR_NAMES[curDir];
}
document.querySelectorAll(".nav-btn").forEach(btn=>{btn.addEventListener("click",()=>{document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");curDir=btn.dataset.dir;render();});});
document.querySelectorAll("#lf .fb").forEach(btn=>{btn.addEventListener("click",()=>{document.querySelectorAll("#lf .fb").forEach(b=>b.classList.remove("on"));btn.classList.add("on");curLevel=btn.dataset.v;render();});});
document.querySelectorAll("#tf .fb").forEach(btn=>{btn.addEventListener("click",()=>{document.querySelectorAll("#tf .fb").forEach(b=>b.classList.remove("on"));btn.classList.add("on");curType=btn.dataset.v;render();});});
document.getElementById("si").addEventListener("input",e=>{query=e.target.value.toLowerCase().trim();render();});
document.getElementById("cnt-all").textContent=D.length;
render();
</script>
